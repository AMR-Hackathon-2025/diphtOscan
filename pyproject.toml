[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "diphtoscan"
dependencies = [
    "biopython",
    "pandas",
    "requests",
    "tqdm>=4.0",
    "jinja2>=3.0",
]
requires-python = ">= 3.8"

authors = [
  { name = "Melanie HENNART" },
  { name = "Martin RETHORET-PASTY", email = "martin.rethoret-pasty@pasteur.fr" }
]
maintainers = [
  { name = "Martin RETHORET-PASTY", email = "martin.rethoret-pasty@pasteur.fr" }
]

description = "diphtoscan annotates antibiotic resistance and virulence factors in _Corynebacterium diphtheriae_ species complex (CdSC) assemblies"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["bioinformatics", "genomics", "antibiotic resistance", "virulence factors"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.8",
]

[project.urls]
Homepage = "https://gitlab.pasteur.fr/BEBP/diphtoscan"

[project.scripts]
diphtoscan = "diphtoscan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "diphtoscan.cli.__version__"}

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["diphtoscan"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.setuptools_scm]